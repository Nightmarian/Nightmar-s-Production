<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Библиотека — Nightmar’s Production</title>

<link rel="icon" type="image/png" href="assets/favicon.png">
  
  <!-- Основные стили -->
  <link rel="stylesheet" href="css/style.css?v=4">
</head>

<body>

  <!-- =================================
       VHS EFFECT
       ================================= -->

  <div class="vhs-overlay" aria-hidden="true">

    <div class="vhs-scanlines"></div>

    <div class="vhs-noise"></div>

    <div class="vhs-tracking"></div>

  </div>

  <!-- =================================
       REC INDICATOR
       ================================= -->

  <div class="vhs-rec" aria-hidden="true">

    <span class="rec-dot"></span>

    <span class="rec-text">REC</span>

  </div>

<link rel="stylesheet" href="css/navigation.css">
<script src="scripts/navigation.js" defer></script>
  
  <!-- =================================
       LIBRARY
       ================================= -->

  <main class="library">

    <p class="eyebrow">
      Закрытый фонд
    </p>

    <h1>
      Библиотека
    </h1>

    <p class="subtitle">
      Документы, восстановленные из архива Nightmar’s Production.
    </p>

    <!-- Книги загружаются автоматически -->
    <div class="book-grid"></div>

  </main>

  <!-- =================================
       FOOTER
       ================================= -->

  <footer class="site-footer">

    <p>
      Nightmar’s Production © 2026
    </p>

    <p class="muted">
      Секретная «Популярная военная база»
    </p>

  </footer>

  <!-- Автоматическая загрузка библиотеки -->
  <script src="scripts/library.js"></script>

</body>
</html>
