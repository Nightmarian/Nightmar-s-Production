name: Автоматическая обработка книг

on:
  push:
    paths:
      - "books/source/**"
      - "scripts/build.py"
      - ".github/workflows/books.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Обработать книги
        run: python scripts/build.py

      - name: Сохранить изменения
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add books/ books.json

          if ! git diff --cached --quiet; then
            git commit -m "Автоматическое добавление книг"
            git push
          fi
