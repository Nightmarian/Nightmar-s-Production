<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nightmar Runner | Nightmar's Production</title>

  <link rel="stylesheet" href="../css/runner.css">

<link rel="stylesheet" href="../css/navigation.css">
<script src="../scripts/navigation.js" defer></script>

</head>

<body>

  <main class="game-container">

    <a href="../index.html" class="back-button">
      ← НА ГЛАВНУЮ
    </a>

    <header>
      <h1>NIGHTMAR RUNNER</h1>
      <p class="subtitle">RUN // SURVIVE // RECONNECT</p>
    </header>

    <div class="game-info">
      <span>Ваши очки: <strong id="score">00000</strong></span>
      <span>Лучший рекорд: <strong id="best">00000</strong></span>
    </div>

    <div class="game-wrapper">
      <canvas id="game" width="800" height="450"></canvas>

      <div id="gameOverlay" class="game-overlay">
        <h2 id="overlayTitle">NIGHTMAR RUNNER</h2>
        <p id="overlayText">Нажми, чтобы начать</p>
        <button id="startButton">START GAME</button>
      </div>
    </div>

    <div class="mobile-controls">
  <button id="jumpButton" type="button" aria-label="Прыжок">
    ↑
  </button>

  <button id="slideButton" type="button" aria-label="Подкат">
    ↓
  </button>
</div>

   <p class="controls">
  ПК: ПРОБЕЛ / ↑ — ПРЫЖОК | ↓ — ПОДКАТ<br>
  ТЕЛЕФОН: ЛЕВАЯ ПОЛОВИНА — ПРЫЖОК | ПРАВАЯ — ПОДКАТ
</p>

  </main>

  <script src="../scripts/runner.js"></script>

</body>
</html>
